<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-MOW 1.4 首页智控台 · 去竞品化全浅色三方案对比</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme-1.4.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #DDE3EC;
    color: #14171C;
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 24px 24px 48px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; border: none; background: none; color: inherit; }

  /* ---------- 顶部评审控制条 ---------- */
  .review-bar {
    max-width: 1420px;
    margin: 0 auto 22px;
    background: #FFFFFF;
    border: 1px solid #CFD7E2;
    border-radius: 16px;
    padding: 15px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: 0 4px 16px rgba(17, 19, 23, 0.05);
  }
  .review-title h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tag-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    background: #EEF2F7;
    color: #14171C;
    border: 1px solid #CFD7E2;
    border-bottom: 2px solid #F08300;
  }
  .review-title p {
    margin-top: 4px;
    font-size: 12px;
    color: #5B6470;
  }
  .review-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #F3F5F8;
    border: 1px solid #DCE2E8;
    padding: 4px;
    border-radius: 10px;
  }
  .ctrl-group .lbl {
    font-size: 11px;
    font-weight: 600;
    color: #5B6470;
    padding: 0 6px;
  }
  .ctrl-group button {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 7px;
    color: #5B6470;
    cursor: pointer;
    transition: all 0.14s;
  }
  .ctrl-group button:hover { color: #14171C; }
  .ctrl-group button.on { background: #1E232B; color: #FFFFFF; }
  .back-link {
    font-size: 12px;
    font-weight: 600;
    color: #14171C;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 9px;
    background: #FFFFFF;
    border: 1px solid #CFD7E2;
  }
  .back-link:hover { background: #F3F5F8; }

  /* ---------- 三方案并排网格 ---------- */
  .variants-grid {
    max-width: 1420px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 414px);
    justify-content: center;
    gap: 28px;
  }
  @media (max-width: 1360px) {
    .variants-grid { grid-template-columns: repeat(2, 414px); }
  }
  @media (max-width: 900px) {
    .variants-grid { grid-template-columns: 414px; }
  }
  .variant-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .variant-meta {
    width: 100%;
    min-height: 22px;
    padding: 0 6px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
  }
  .variant-meta .name {
    font-size: 13.5px;
    font-weight: 700;
    color: #14171C;
  }
  .variant-meta .sub {
    font-size: 11px;
    color: #5B6470;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .device-chassis {
    background: #14161A;
    border-radius: 54px;
    padding: 12px;
    box-shadow:
      0 26px 56px -18px rgba(17, 19, 23, 0.34),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  }

  /* =========================================================
     公共手机画幅 & 浅色通用底栏
     ========================================================= */
  .hv-screen {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: #EEF1F5;
    color: var(--text-primary);
    font-family: var(--font-ui);
    user-select: none;
  }
  .hv-light-tabs {
    height: 62px;
    background: #FFFFFF;
    border-top: 1px solid #E7ECF2;
    display: flex;
    padding: 4px 28px 10px;
    flex: none;
    position: relative;
    z-index: 9;
  }
  .hv-light-tabs.abs {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .hv-light-tabs button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 11px;
    font-weight: 500;
    color: #6B7480;
    position: relative;
    cursor: pointer;
  }
  .hv-light-tabs button.on {
    color: #14171C;
    font-weight: 700;
  }
  .hv-light-tabs button.on::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: #F08300;
  }

  /* 公共轻量状态/信号组件 */
  .hv-sig-chip {
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    color: #2B333E;
    font-size: 11px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(17, 19, 23, 0.04);
  }
  .hv-sig-chip:hover { border-color: #B8C2CC; }
  .hv-mow-bar {
    height: 6px;
    border-radius: 999px;
    background: #E2ECE4;
    overflow: hidden;
  }
  .hv-mow-bar i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #1E8E57 0%, #2CB571 100%);
  }

  /* =========================================================
     新方案 1：X5 银翼展厅 · 实机 + 画中图（强化品牌与实机质感）
     ========================================================= */
  .s1-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #E8EDF3 0%, #F4F6F9 44%, #ECEFF4 100%);
  }
  .s1-topbar {
    margin-top: 46px;
    height: 44px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex: none;
  }
  .s1-brand-select {
    height: 36px;
    padding: 0 11px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #DCE2EA;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .s1-brand-select img.logo { height: 12px; width: auto; display: block; }
  .s1-brand-select .sep { width: 1px; height: 12px; background: #D2D9E2; }
  .s1-brand-select .dev {
    font-size: 12.5px;
    font-weight: 700;
    color: #14171C;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  /* 一体式分段胶囊：消除竞品右上双孤圆按钮 */
  .s1-seg-actions {
    height: 36px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #DCE2EA;
    display: inline-flex;
    align-items: center;
    overflow: hidden;
  }
  .s1-seg-actions button {
    width: 38px;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #1E232B;
    position: relative;
    cursor: pointer;
  }
  .s1-seg-actions button:hover { background: #F1F4F8; }
  .s1-seg-actions .vsep { width: 1px; height: 16px; background: #E1E6EE; }
  .s1-seg-actions .dot {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--state-danger);
    border: 1.5px solid #FFFFFF;
  }

  /* 展台核心区 */
  .s1-showroom {
    margin: 6px 16px 0;
    border-radius: 22px;
    background: radial-gradient(ellipse 92% 72% at 50% 54%, #FFFFFF 0%, #F3F6FA 62%, #E7ECF3 100%);
    border: 1px solid #DDE3EC;
    padding: 14px 16px 12px;
    position: relative;
    overflow: hidden;
    flex: none;
  }
  /* 呼应 T-MOW LOGO 16° 斜切柔光带 */
  .s1-slash-glow {
    position: absolute;
    right: -28px;
    top: -12px;
    width: 140px;
    height: 290px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.15) 100%);
    transform: skewX(-16deg);
    pointer-events: none;
  }
  .s1-hero-head {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .s1-status-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #14171C;
  }
  .s1-status-sub {
    margin-top: 2px;
    font-size: 12px;
    color: #5B6470;
  }
  .s1-bat-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex: none;
  }
  .s1-bat-num {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    line-height: 1;
  }
  .s1-bat-num b { font-size: 27px; font-weight: 700; color: #14171C; }
  .s1-bat-num span { font-size: 12px; font-weight: 600; color: #5B6470; }
  .s1-mower-stage {
    position: relative;
    z-index: 2;
    margin-top: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .s1-mower-stage img {
    width: 236px;
    height: auto;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 18px rgba(17, 19, 23, 0.18));
  }
  .s1-mower-stage .shadow {
    width: 184px;
    height: 13px;
    margin-top: -21px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(17, 19, 23, 0.24) 0%, rgba(17, 19, 23, 0.06) 56%, transparent 80%);
  }
  .s1-energy-rail {
    margin-top: 8px;
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .s1-energy-rail .track {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: #DDE3EC;
    overflow: hidden;
    position: relative;
  }
  .s1-energy-rail .fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #1F8D57 0%, #2FC17A 92%, #F08300 100%);
  }

  /* 宽幅庭院画中图 */
  .s1-map-card {
    margin: 10px 16px 0;
    height: 146px;
    border-radius: 20px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    padding: 5px;
    position: relative;
    overflow: hidden;
    flex: none;
  }
  .s1-map-inner {
    width: 100%;
    height: 100%;
    border-radius: 15px;
    overflow: hidden;
    background: #EAEFEA;
    position: relative;
  }
  .s1-map-inner svg { width: 100%; height: 100%; display: block; }
  .s1-expand-pill {
    position: absolute;
    right: 7px;
    top: 7px;
    height: 23px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid #D7E0DA;
    font-size: 10.5px;
    font-weight: 700;
    color: #14171C;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(17, 19, 23, 0.08);
  }
  .s1-map-badge {
    position: absolute;
    left: 7px;
    top: 7px;
    height: 23px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(45, 115, 72, 0.14);
    font-size: 10.5px;
    font-weight: 700;
    color: #29563B;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* 方案 1 割草中/展开态：紧凑实机条 + 大画幅地图卡 */
  .s1-compact-strip {
    margin: 6px 16px 0;
    padding: 10px 14px;
    border-radius: 18px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
  }
  .s1-compact-strip .thumb {
    width: 58px;
    height: 44px;
    border-radius: 12px;
    background: #F1F4F8;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .s1-compact-strip .thumb img { width: 50px; height: auto; }
  .s1-bigmap-card {
    margin: 10px 16px 0;
    flex: 1;
    min-height: 0;
    border-radius: 22px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .s1-bigmap-view {
    flex: 1;
    min-height: 0;
    border-radius: 16px;
    overflow: hidden;
    background: #EAEFEA;
    position: relative;
  }
  .s1-bigmap-view svg { width: 100%; height: 100%; display: block; }
  .s1-bigmap-prog {
    padding: 6px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: none;
  }

  /* 方案 1 一主两副按键坞 + 3 格仪表卡 */
  .s1-dock-row {
    margin: 10px 16px 0;
    display: flex;
    gap: 8px;
    flex: none;
  }
  .s1-cta-main {
    flex: 1.55;
    height: 50px;
    border-radius: 14px;
    background: #1E232B;
    color: #FFFFFF;
    font-size: 14.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .s1-cta-main::before {
    content: "";
    position: absolute;
    left: 0;
    top: 11px;
    bottom: 11px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: #F08300;
  }
  .s1-cta-sub {
    flex: 1;
    height: 50px;
    border-radius: 14px;
    background: #FFFFFF;
    border: 1px solid #D9E0E8;
    color: #14171C;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
  }
  .s1-cta-sub:hover { background: #F5F7FA; }
  .s1-metrics-row {
    margin: 10px 16px 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    flex: none;
  }
  .s1-metric-box {
    background: #FFFFFF;
    border: 1px solid #E1E6EE;
    border-radius: 13px;
    padding: 9px 10px;
    text-align: left;
    cursor: pointer;
  }
  .s1-metric-box .k { font-size: 10.5px; font-weight: 600; color: #6B7480; }
  .s1-metric-box .v { margin-top: 2px; font-size: 13px; font-weight: 700; color: #14171C; white-space: nowrap; }

  /* =========================================================
     新方案 2：庭院 Bento 仪表板 · 画框式地图（彻底告别右侧立柱）
     ========================================================= */
  .s2-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #ECEFF4;
  }
  .s2-topbar {
    margin-top: 46px;
    height: 46px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }
  .s2-dev-avatar {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .s2-dev-avatar .ava-box {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .s2-dev-avatar .ava-box img { width: 32px; height: auto; }
  .s2-dev-avatar .t1 {
    font-size: 15px;
    font-weight: 700;
    color: #14171C;
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1.15;
  }
  .s2-dev-avatar .t2 {
    margin-top: 2px;
    font-size: 11px;
    font-weight: 600;
    color: #5B6470;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  /* 极简无框纯线性图标组 */
  .s2-plain-icons {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .s2-plain-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #1E232B;
    position: relative;
    cursor: pointer;
  }
  .s2-plain-btn:hover { background: rgba(20, 23, 28, 0.05); }
  .s2-plain-btn .dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--state-danger);
    border: 1.5px solid #ECEFF4;
  }

  /* Card 1: 瓷白核心遥测卡 + 环形电量表盘 */
  .s2-tele-card {
    margin: 6px 16px 0;
    padding: 14px 16px;
    border-radius: 20px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: none;
  }
  .s2-tele-left { flex: 1; min-width: 0; }
  .s2-tele-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #14171C;
  }
  .s2-tele-sub {
    margin-top: 3px;
    font-size: 12px;
    color: #5B6470;
  }
  .s2-mini-chips {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .s2-mini-chip {
    padding: 4px 8px;
    border-radius: 8px;
    background: #F4F6F9;
    border: 1px solid #E6EBF1;
    font-size: 11px;
    font-weight: 600;
    color: #2B333E;
    cursor: pointer;
  }
  .s2-ring-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: none;
  }
  .s2-ring-wrap {
    position: relative;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .s2-ring-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .s2-ring-val {
    font-size: 16px;
    font-weight: 700;
    color: #14171C;
    line-height: 1;
  }
  .s2-ring-val small { font-size: 10px; color: #5B6470; font-weight: 600; }

  /* Card 2: 画框式地图卡 + 内嵌底部三格毛玻璃工具条 */
  .s2-map-frame {
    margin: 10px 16px 0;
    flex: 1;
    min-height: 0;
    border-radius: 22px;
    background: #FFFFFF;
    border: 1px solid #DCE2EA;
    padding: 6px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .s2-map-viewport {
    flex: 1;
    min-height: 0;
    border-radius: 17px;
    background: #EAEFEA;
    overflow: hidden;
    position: relative;
  }
  .s2-map-viewport svg { width: 100%; height: 100%; display: block; }
  .s2-map-topchip {
    position: absolute;
    left: 10px;
    top: 10px;
    height: 26px;
    padding: 0 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.90);
    border: 1px solid rgba(45, 115, 72, 0.16);
    font-size: 11px;
    font-weight: 700;
    color: #1F4D32;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .s2-map-bottom-bar {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 6px 18px rgba(17, 19, 23, 0.08);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    overflow: hidden;
  }
  .s2-map-bottom-bar button {
    display: inline-flex;

        <div style="display:flex;gap:10px">
          <button class="p-btn p-btn-secondary" style="flex:1" data-act="closeModal">取消</button>
          <button class="p-btn p-btn-primary" style="flex:1" data-act="setState" data-st="idle">确认回桩</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

function renderAll() {
  const cols = [
    { name: '新方案 1 · X5 银翼展厅', sub: '实机主视觉 + 宽幅画中图', html: renderScheme1() },
    { name: '新方案 2 · Bento 仪表板', sub: '环形电量 + 画框地图 + 底缘工具条', html: renderScheme2() },
    { name: '新方案 3 · 轻银地图双轨坞', sub: '一体顶栏 + 横向工具带 + 非对称主控', html: renderScheme3() },
  ];
  document.getElementById('grid').innerHTML = cols.map(c => `
    <section class="variant-col">
      <div class="variant-meta">
        <span class="name">${c.name}</span>
        <span class="sub">${c.sub}</span>
      </div>
      <div class="device-chassis">${c.html}</div>
    </section>
  `).join('');

  document.querySelectorAll('#stateCtrl button').forEach(b => b.classList.toggle('on', b.dataset.st === APP.st));
}

let toastT = null;
function showToast(msg) {
  document.querySelector('.proto-toast')?.remove();
  clearTimeout(toastT);
  const el = document.createElement('div');
  el.className = 'proto-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastT = setTimeout(() => el.remove(), 2200);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-st],[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'setState') { APP.st = btn.dataset.st; APP.modal = null; return renderAll(); }
  if (btn.dataset.st) { APP.st = btn.dataset.st; APP.modal = null; return renderAll(); }

  const act = btn.dataset.act;
  if (act === 'toggleS1Map') { APP.s1Expanded = !APP.s1Expanded; renderAll(); }
  else if (act === 'openModal') { APP.modal = { target: btn.dataset.target, kind: btn.dataset.kind }; renderAll(); }
  else if (act === 'closeModal') { APP.modal = null; renderAll(); }
  else if (act === 'toggleDockClear') {
    APP.dockClear = !APP.dockClear;
    if (APP.dockClear) APP.dockAuto = false;
    renderAll();
  }
  else if (act === 'toggleDockAuto') {
    if (!APP.dockClear) { APP.dockAuto = !APP.dockAuto; renderAll(); }
  }
  else if (act === 'toast') { showToast(btn.dataset.msg || '操作已触发'); }
});

renderAll();
</script>
</body>
</html>
